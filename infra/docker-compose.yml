# Hạ tầng local cho AI CONTENT STUDIO.
# Chạy từ thư mục gốc:  pnpm infra:up   (tương đương docker compose -f infra/docker-compose.yml --env-file .env up -d)
name: ai-content-studio

services:
  postgres:
    image: postgres:17-alpine
    container_name: acs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_studio}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: acs-redis
    restart: unless-stopped
    # appendonly để job BullMQ không mất khi restart container
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO đã ngừng phát hành image chính thức (minio/minio bị gỡ khỏi Docker Hub, quay.io trả 401).
    # Dùng bản build MinIO do cộng đồng Pigsty duy trì; ghim tag cụ thể để môi trường tái lập được.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: acs-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acs_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD trong .env}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      # image minio/minio có sẵn mc; "mc ready local" là healthcheck chính thức
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
